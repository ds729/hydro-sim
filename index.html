<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>水耕栽培シミュレータ v0.5（開発版）</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="pn" id="hud">
    <div class="hd"><b id="day"></b><span id="cn"></span><button id="mb" aria-expanded="false" title="時間・カメラ・栽培日誌を開く">☰ 時間・日誌</button></div>
    <div id="gs"></div>
    <div id="gh"><div class="row">生育<div class="bar"><i id="gb"></i></div></div><div class="row">健康<div class="bar"><i id="hb"></i></div></div></div>
    <canvas id="ch" width="230" height="64" style="width:100%;height:64px"></canvas>
    <small class="ln">緑＝EC　青＝pH（適正帯は各ゲージの緑）<br>※数値は仮置きの簡略モデルです。実栽培は地域の試験場等で確認してください。</small>
    <small class="sn">※数値は仮置きの簡略モデルです</small>
  </div>
  <div id="side">
    <div class="pn" id="act"><h3>時間</h3><div id="sp"></div><h3>カメラ</h3><div id="cm"></div><h3>画質 <span id="fps"></span></h3><div id="qa"></div></div>
    <div class="pn" id="log"><h3>📖 栽培日誌</h3><div id="jl"></div></div>
  </div>
  <div class="pn" id="bar"></div>
  <div id="res"><div class="pn" id="rb"></div></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
